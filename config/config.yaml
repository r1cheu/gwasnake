run_id: "variance_new_none"
phenotype: "phenotype/sh_f1_new_replaced.phen"

# which analyses rule all builds: any of gwas, conditional, variance, heterogeneity
analyses:
  - variance

phenotypes:
  - PanicleNeckLength
  - FlagLeafLength
  - FlagLeafWidth
  - PanicleNumber
  - StrawWeight
  - GrainToStrawRatio
  - YieldPerPlant
  - SeedSettingRate
  - TotalGrainNumberPerPanicle
  - FullGrainNumberPerPanicle
  - TotalGrainNumber
  - FullGrainNumber
  - HeadingDate

bfile:
  step1: "bfile/valid_LDfilter"
  step2: "bfile/valid"

# optional CLASS column partitions QTL into variance classes (default: single class)
qtl_list: "config/qtl_list_12_5k.tsv"

# QTL regions removed from the background GRM (and, in variance, built into the
# QTL GRM), shared by all non-GWAS analyses: all (whole qtl_list) | per_phenotype
qtl_scope: all

# two-step --indep-pairwise applied in order on the QTL-region-removed background
ld_prune:
  - "10kb 1 0.8"
  - "50 1 0.8"

pca: 5

plink2:
  pca_threads: 1

# global transform applied to every phenotype: iint | dint | none
transform:
  gwas: iint
  conditional: dint
  variance: none
  heterogeneity: dint

heterogeneity:
  # genetic-background strata from k-means on the background PCs (config.pca)
  n_strata: 12
  het_min: 5
  # minimum per stratum for EACH homozygote class (AA and aa counted separately)
  hom_min: 3
  # a locus is tested only if at least this many strata are three-class
  min_strata: 6

gelex:
  grm_threads: 1
  assoc_threads: 1
  reml_threads: 1
