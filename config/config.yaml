run_id: "heterogeneity_NS"
phenotype: "phenotype/sh_f1_restorer_new_replaced.phen"

phenotypes:
  - PanicleNeckLength
  - FlagLeafLength
  - FlagLeafWidth
  - PanicleNumber
  - GrainToStrawRatio
  - YieldPerPlant
  - SeedSettingRate
  - TotalGrainNumberPerPanicle
  - FullGrainNumberPerPanicle
  - TotalGrainNumber
  - FullGrainNumber

bfile:
  # LD-filtered markers for PCA and genetic-background strata.
  step1: "bfile/valid_LDfilter"
  # QTL genotypes and markers for background GRMs.
  step2: "bfile/valid"

qtl_list: "config/qtl_list.tsv"
# Candidate loci: all traits' QTL or only the current trait's QTL.
# 'all' also excludes every input region from the background GRMs.
qtl_scope: all

# Two sequential LD-pruning passes on the QTL-region-removed background.
ld_prune:
  - "10kb 1 0.8"
  - "50 1 0.8"

pca: 5

plink2:
  pca_threads: 1

# none | dint. Keep the same fixed-effect design in null and full models.
transform: dint

heterogeneity:
  n_strata: 12
  # Minimum heterozygotes and EACH homozygote class per informative stratum.
  het_min: 5
  hom_min: 3
  min_strata: 6

gelex:
  grm_threads: 8
  reml_threads: 8
