run_id: "susie"
halfsib: "config/empty.csv"
phenotype: "phenotype/sh_f1_restorer_new_replaced.phen"

# fine-mapping regions, one BED per phenotype (cols: chr start end [name])
regions: "regions/{phenotype}.bed"

# phenotypes to fine-map
phenotypes:
  # - PlantHeight
  # - StemLength
  # - PanicleNeckLength
  # - FlagLeafLength
  - FlagLeafWidth
  # - PanicleNumber
  # - StemDiameterLength
  # - StemDiameterWidth
  # - StrawWeight
  # - GrainToStrawRatio
  # - YieldPerPlant
  # - KiloGrainWeight
  # - SeedSettingRate
  # - TotalGrainNumberPerPanicle
  # - FullGrainNumberPerPanicle
  # - TotalGrainNumber
  # - EmptyGrainNumber
  # - FullGrainNumber
  # - GrainShape
  # - GrainLength
  # - GrainWidth
  # - GrainArea
  # - Perimeter
  # - Roundness
  #
bfile:
  step1: "bfile/6983_train_xiansub_LDfilter"
  step2: "bfile/6983_train_xiansub"

pca: 5

plink:
  threads: 8

# per-phenotype transform (phenotypes not listed = no transform)
transform:
  # PlantHeight: "iint"
  # StemLength: "iint"
  # PanicleNeckLength: "iint"
  # FlagLeafLength: "iint"
  FlagLeafWidth: "iint"
  # PanicleNumber: "iint"
  # StemDiameterLength: "iint"
  # StemDiameterWidth: "iint"
  # StrawWeight: "iint"
  # GrainToStrawRatio: "iint"
  # YieldPerPlant: "iint"
  # KiloGrainWeight: "iint"
  # SeedSettingRate: "iint"
  # TotalGrainNumberPerPanicle: "iint"
  # FullGrainNumberPerPanicle: "iint"
  # TotalGrainNumber: "iint"
  # EmptyGrainNumber: "iint"
  # FullGrainNumber: "iint"
  # GrainShape: "iint"
  # GrainLength: "iint"
  # GrainWidth: "iint"
  # GrainArea: "iint"
  # Perimeter: "iint"
  # Roundness: "iint"
  #
gelex:
  grm_threads: 8
  reml_threads: 8

# susieR fine-mapping parameters
susie:
  L: 10
  coverage: 0.95
  min_abs_corr: 0.5
  # standardize whitened columns (TRUE: fine-map on LD correlation structure,
  # susieR default; FALSE: keep NC center-only variance weighting)
  standardize: true
