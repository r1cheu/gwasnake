run_id: "6983_peak"
phenotype: "phenotype/sh_f1_new_replaced.phen"

# which analyses rule all builds: any of gwas, conditional, heterogeneity
analyses:
  - conditional
  - heterogeneity

phenotypes:
  - PanicleNeckLength
  - FlagLeafLength
  - FlagLeafWidth
  - PanicleNumber
  - StrawWeight
  - GrainToStrawRatio
  - YieldPerPlant
  - SeedSettingRate
  - TotalGrainNumberPerPanicle
  - FullGrainNumberPerPanicle
  - TotalGrainNumber
  - FullGrainNumber
  - HeadingDate

bfile:
  step1: "bfile/6983_train_xiansub_LDfilter"
  step2: "bfile/6983_train_xiansub"

qtl_list: "config/qtl_list.tsv"

# two-step --indep-pairwise applied in order on the QTL-region-removed background
ld_prune:
  - "10kb 1 0.8"
  - "50 1 0.8"

pca: 5

plink2:
  pca_threads: 1

# global transform applied to every phenotype: iint | dint | none
transform:
  gwas: iint
  conditional: dint
  heterogeneity: dint

heterogeneity:
  family_file: "config/6983_family.tsv"
  het_min: 3
  hom_min: 1
  min_families: 10

gelex:
  grm_threads: 1
  assoc_threads: 1
  reml_threads: 1
